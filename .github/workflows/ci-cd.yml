name: Portfolio CI/CD Pipeline

on:
  push:
    branches: [ main, ft-develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: portfolio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-site:
    name: Build Next.js site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build and Export
        run: npm run build
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: built-site
          path: out

  validate-html:
    name: Validate - HTML Structure
    runs-on: ubuntu-latest
    needs: build-site
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dev dependencies
        run: npm ci --legacy-peer-deps
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: built-site
          path: out
      - name: Validate HTML
        run: npx html-validate out/index.html || exit 1

  validate-ts:
    name: Validate - TypeScript
    runs-on: ubuntu-latest
    needs: build-site
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dev dependencies
        run: npm ci --legacy-peer-deps
      - name: Run TypeScript type-check
        run: npx tsc --noEmit || exit 1
      - name: Run ESLint
        run: npx next lint || exit 1

  validate-deps-security:
    name: Validate - Dependencies Security
    runs-on: ubuntu-latest
    needs: build-site
    steps:
      - uses: actions/checkout@v4
      - name: Install deps for audit
        run: npm ci --legacy-peer-deps
      - name: Run npm audit
        run: npm audit --audit-level=high || exit 1

  validate-bundle-size:
    name: Validate - Bundle Size
    runs-on: ubuntu-latest
    needs: build-site
    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: built-site
          path: out
      - name: Check bundle size
        run: |
          BUNDLE_SIZE=$(du -sb out | cut -f1)
          if [ $BUNDLE_SIZE -gt 15485760 ]; then echo "Bundle too large: $BUNDLE_SIZE bytes" && exit 1; fi

  deploy-pages:
    name: Deploy - GitHub Pages
    runs-on: ubuntu-latest
    needs: [validate-html, validate-ts, validate-deps-security, validate-bundle-size]
    if: github.ref == 'refs/heads/main' && success()
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: built-site
          path: out
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - id: deployment
        uses: actions/deploy-pages@v4
